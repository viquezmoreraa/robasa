<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d2347">
    <meta name="description" content="Formulario de Datos Personales - ROBASA Distribuidora.">
    <title>ROBASA | Datos Personales</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="imagenes/robasa-logo.png">

    <!-- Tipografía Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            color-scheme: dark;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #091833;
            color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background: 
                radial-gradient(circle at 15% 20%, rgba(245, 132, 38, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(18, 59, 112, 0.6) 0%, transparent 50%),
                linear-gradient(135deg, #091833 0%, #0f2d59 100%);
            position: relative;
        }

        /* Elementos decorativos flotantes */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            z-index: 0;
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
        }
        body::before { background: #f58426; top: -100px; left: -100px; }
        body::after { background: #123b70; bottom: -100px; right: -100px; }

        /* Contenedor principal */
        main {
            position: relative;
            z-index: 1;
            width: min(100%, 500px);
            padding: 2.5rem 2rem;
            background: rgba(15, 35, 70, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-section {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo-img {
            max-width: 150px;
            height: auto;
            margin-bottom: 1rem;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.3));
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.01em;
            margin-bottom: 0.3rem;
        }

        .selected-puesto {
            font-size: 0.85rem;
            color: #f58426;
            font-weight: 600;
            margin-bottom: 1.25rem;
            text-transform: capitalize;
        }

        /* Estilos del Formulario */
        .form-group {
            margin-bottom: 1.1rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        input, select {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(10, 25, 50, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 0.65rem;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #f58426;
            background: rgba(10, 25, 50, 0.95);
            box-shadow: 0 0 0 3px rgba(245, 132, 38, 0.2);
        }

        select option {
            background: #0f2346;
            color: #ffffff;
        }

        /* Contenedor para Fecha de Nacimiento (3 selects lado a lado) */
        .date-container {
            display: grid;
            grid-template-columns: 1fr 1.3fr 1fr;
            gap: 0.5rem;
        }

        /* Sección desplegable para detalles de licencia y vehículo */
        .conditional-box {
            background: rgba(245, 132, 38, 0.08);
            border: 1px dashed rgba(245, 132, 38, 0.4);
            border-radius: 0.75rem;
            padding: 1rem;
            margin-top: 0.8rem;
            display: none; /* Oculto por defecto */
            animation: fadeIn 0.4s ease forwards;
        }

        .conditional-box.active {
            display: block;
        }

        /* Botón de Siguiente */
        .btn-submit {
            display: block;
            width: 100%;
            margin-top: 1.5rem;
            padding: 0.8rem 1rem;
            background: linear-gradient(135deg, #f58426 0%, #e06d12 100%);
            border: none;
            border-radius: 0.75rem;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(245, 132, 38, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(245, 132, 38, 0.5);
            filter: brightness(1.05);
        }

        /* Enlace de regresar */
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.25rem;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <main>
        <div class="header-section">
            <img src="imagenes/robasa-logo.png" alt="ROBASA Distribuidora" class="logo-img">
            <h2>Información Personal</h2>
            <div class="selected-puesto" id="puestoDisplay">Postulándose para: ...</div>
        </div>

        <!-- Formulario de datos personales -->
        <form action="experiencia.html" method="GET" id="personalForm">
            <!-- Campo oculto para arrastrar el puesto seleccionado -->
            <input type="hidden" name="puesto" id="inputPuesto">

            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" placeholder="Ej. Juan Pérez Gómez" required>
            </div>

            <div class="form-group">
                <label for="cedula">Número de Cédula / Identificación</label>
                <input type="text" id="cedula" name="cedula" placeholder="Ej. 1-0234-0567" required>
            </div>

            <!-- FECHA DE NACIMIENTO SÚPER FÁCIL (Día, Mes, Año) -->
            <div class="form-group">
                <label>Fecha de nacimiento</label>
                <div class="date-container">
                    <select id="dia" name="dia" required>
                        <option value="" disabled selected>Día</option>
                        <!-- Se llena con JS del 1 al 31 -->
                    </select>
                    <select id="mes" name="mes" required>
                        <option value="" disabled selected>Mes</option>
                        <option value="1">Enero</option>
                        <option value="2">Febrero</option>
                        <option value="3">Marzo</option>
                        <option value="4">Abril</option>
                        <option value="5">Mayo</option>
                        <option value="6">Junio</option>
                        <option value="7">Julio</option>
                        <option value="8">Agosto</option>
                        <option value="9">Setiembre</option>
                        <option value="10">Octubre</option>
                        <option value="11">Noviembre</option>
                        <option value="12">Diciembre</option>
                    </select>
                    <select id="anio" name="anio" required>
                        <option value="" disabled selected>Año</option>
                        <!-- Se llena con JS -->
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="telefono">Número de Teléfono</label>
                <input type="tel" id="telefono" name="telefono" placeholder="Ej. 8888-8888" required>
            </div>

            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" name="correo" placeholder="Ej. juan.perez@correo.com" required>
            </div>

            <!-- PREGUNTA DE LICENCIA -->
            <div class="form-group">
                <label for="tiene_licencia">¿Cuenta con licencia de conducir?</label>
                <select id="tiene_licencia" name="tiene_licencia" onchange="toggleLicenciaDetails()" required>
                    <option value="" disabled selected>Seleccione una opción</option>
                    <option value="si">Sí</option>
                    <option value="no">No</option>
                </select>
            </div>

            <!-- BLOQUE CONDICIONAL (Solo aparece si dice que SÍ tiene licencia) -->
            <div id="licenciaDetails" class="conditional-box">
                <div class="form-group">
                    <label for="tipo_licencia">Tipo de licencia</label>
                    <select id="tipo_licencia" name="tipo_licencia">
                        <option value="" disabled selected>Seleccione el tipo</option>
                        <option value="B1">B1 (Vehículo liviano / Automóvil)</option>
                        <option value="B2">B2 (Camión liviano / Carga)</option>
                        <option value="B3">B3 (Camión pesado)</option>
                        <option value="A1">A1 / A2 (Motocicleta)</option>
                        <option value="otra">Otra / Varias</option>
                    </select>
                </div>

                <div class="form-group" style="margin-bottom: 0;">
                    <label for="tiene_vehiculo">¿Cuenta con vehículo propio (carro o moto)?</label>
                    <select id="tiene_vehiculo" name="tiene_vehiculo">
                        <option value="" disabled selected>Seleccione una opción</option>
                        <option value="carro">Sí, automóvil / carro</option>
                        <option value="moto">Sí, motocicleta</option>
                        <option value="ambos">Sí, ambos</option>
                        <option value="no">No cuenta con vehículo propio</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-submit">Siguiente paso</button>
        </form>

        <a href="terminos.html" class="back-link">← Volver a términos</a>
    </main>

    <!-- Script de apoyo para llenar fechas automáticamente y mostrar/ocultar licencia -->
    <script>
        // 1. Recuperar el puesto de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const puesto = urlParams.get('puesto') || 'General';
        document.getElementById('puestoDisplay').textContent = `Postulándose para: ${puesto.replace(/_/g, ' ')}`;
        document.getElementById('inputPuesto').value = puesto;

        // 2. Rellenar selectores de Fecha de forma automática (Días y Años)
        const selectDia = document.getElementById('dia');
        for (let i = 1; i <= 31; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.textContent = i;
            selectDia.appendChild(opt);
        }

        const selectAnio = document.getElementById('anio');
        const anioActual = new Date().getFullYear();
        // Permitir personas desde los 16 hasta los 80 años
        for (let i = anioActual - 16; i >= anioActual - 80; i--) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.textContent = i;
            selectAnio.appendChild(opt);
        }

        // 3. Función para mostrar u ocultar las preguntas de vehículo si responde SÍ a licencia
        function toggleLicenciaDetails() {
            const selectLicencia = document.getElementById('tiene_licencia').value;
            const detailsBox = document.getElementById('licenciaDetails');
            const inputTipoLic = document.getElementById('tipo_licencia');
            const inputVehiculo = document.getElementById('tiene_vehiculo');

            if (selectLicencia === 'si') {
                detailsBox.classList.add('active');
                inputTipoLic.setAttribute('required', 'true');
                inputVehiculo.setAttribute('required', 'true');
            } else {
                detailsBox.classList.remove('active');
                inputTipoLic.removeAttribute('required');
                inputVehiculo.removeAttribute('required');
            }
        }
    </script>
</body>
</html>
