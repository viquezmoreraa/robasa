<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d2347">
    <meta name="description" content="Detalles de Postulación - ROBASA Distribuidora.">
    <title>ROBASA | Detalles de la Postulación</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="imagenes/robasa-logo.png">

    <!-- Tipografía Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            color-scheme: dark;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #091833;
            color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background: 
                radial-gradient(circle at 15% 20%, rgba(245, 132, 38, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(18, 59, 112, 0.6) 0%, transparent 50%),
                linear-gradient(135deg, #091833 0%, #0f2d59 100%);
            position: relative;
        }

        /* Elementos decorativos flotantes */
        body::before, body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            z-index: 0;
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
        }
        body::before { background: #f58426; top: -100px; left: -100px; }
        body::after { background: #123b70; bottom: -100px; right: -100px; }

        /* Botón superior de retroceso con flecha */
        .top-back-bar {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            z-index: 10;
        }

        .btn-back-top {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 2rem;
            color: rgba(255, 255, 255, 0.85);
            font-size: 0.825rem;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-back-top:hover {
            background: rgba(245, 132, 38, 0.2);
            border-color: #f58426;
            color: #ffffff;
            transform: translateY(-1px);
        }

        /* Contenedor principal */
        main {
            position: relative;
            z-index: 1;
            width: min(100%, 500px);
            padding: 2.5rem 2rem;
            background: rgba(15, 35, 70, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-section {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .logo-img {
            max-width: 150px;
            height: auto;
            margin-bottom: 1rem;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.3));
        }

        h2 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.01em;
            margin-bottom: 0.3rem;
        }

        /* Estilos del Formulario */
        .form-group {
            margin-bottom: 1.1rem;
            text-align: left;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        select, textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            background: rgba(10, 25, 50, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 0.65rem;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        select:focus, textarea:focus {
            outline: none;
            border-color: #f58426;
            background: rgba(10, 25, 50, 0.95);
            box-shadow: 0 0 0 3px rgba(245, 132, 38, 0.2);
        }

        select option {
            background: #0f2346;
            color: #ffffff;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        /* Bloque condicional para la experiencia previa */
        .conditional-box {
            background: rgba(245, 132, 38, 0.08);
            border: 1px dashed rgba(245, 132, 38, 0.4);
            border-radius: 0.75rem;
            padding: 1rem;
            margin-top: 0.8rem;
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        .conditional-box.active {
            display: block;
        }

        /* Botón de Siguiente */
        .btn-submit {
            display: block;
            width: 100%;
            margin-top: 1.5rem;
            padding: 0.8rem 1rem;
            background: linear-gradient(135deg, #f58426 0%, #e06d12 100%);
            border: none;
            border-radius: 0.75rem;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(245, 132, 38, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(245, 132, 38, 0.5);
            filter: brightness(1.05);
        }

        /* Enlace de regresar inferior */
        .back-link {
            display: block;
            text-align: center;
            margin-top: 1.25rem;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.85rem;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: #ffffff;
        }

        @media (max-width: 480px) {
            .top-back-bar {
                top: 1rem;
                left: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Botón superior con flecha para retroceder -->
    <div class="top-back-bar">
        <a href="datos-personales.html" class="btn-back-top" id="backLinkTop">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            Atrás
        </a>
    </div>

    <main>
        <div class="header-section">
            <img src="imagenes/robasa-logo.png" alt="ROBASA Distribuidora" class="logo-img">
            <h2>Puesto y Experiencia</h2>
        </div>

        <!-- Formulario que ahora apunta correctamente a academico.html -->
        <form action="academico.html" method="GET" id="experienciaForm">
            <!-- Contenedor donde arrastramos todos los datos de pantallas anteriores -->
            <div id="hiddenContainer"></div>
            
            <!-- 1. PUESTO AL QUE DESEA APLICAR -->
            <div class="form-group">
                <label for="puesto">Puesto al que desea aplicar *</label>
                <select id="puesto" name="puesto" required>
                    <option value="" disabled>Seleccione un puesto</option>
                    <option value="chofer">Chofer</option>
                    <option value="promotor">Promotor - mercaderista</option>
                    <option value="encargado_ruta">Encargado de ruta</option>
                    <option value="almacen">Almacen</option>
                    <option value="ayudante_carga">Ayudante de carga</option>
                    <option value="agente_ventas">Agente de ventas</option>
                    <option value="agente_ventas_junior">Agente de ventas junior</option>
                    <option value="agente_mayorista">Agente de ventas Mayorista</option>
                    <option value="supervisor_ventas">Supervisor de Ventas</option>
                    <option value="cuentas_cobrar">Cuentas por Cobrar</option>
                    <option value="facturacion">Facturación</option>
                    <option value="director_operaciones">Director de Operaciones</option>
                    <option value="analista_datos">Analista de Datos</option>
                    <option value="proveduria_jr">Encargado de proveduria jr</option>
                </select>
            </div>

            <!-- 2. PRETENSIÓN SALARIAL -->
            <div class="form-group">
                <label for="salario">Pretensión Salarial *</label>
                <select id="salario" name="salario" required>
                    <option value="" disabled selected>Seleccione rango salarial</option>
                    <option value="350000-400000">₡350.000 – ₡400.000</option>
                    <option value="400001-450000">₡400.001 – ₡450.000</option>
                    <option value="450001-500000">₡450.001 – ₡500.000</option>
                    <option value="500001-550000">₡500.001 – ₡550.000</option>
                    <option value="550001-600000">₡550.001 – ₡600.000</option>
                    <option value="600001-700000">₡600.001 – ₡700.000</option>
                    <option value="700001-850000">₡700.001 – ₡850.000</option>
                    <option value="850001-1000000">₡850.001 – ₡1.000.000</option>
                    <option value="mas_1000000">Más de ₡1.000.000</option>
                </select>
            </div>

            <!-- 3. ZONA -->
            <div class="form-group">
                <label for="zona">Zona *</label>
                <select id="zona" name="zona" required>
                    <option value="" disabled selected>Seleccione la zona</option>
                    <option value="Alajuela">Alajuela</option>
                    <option value="Heredia">Heredia</option>
                    <option value="San Carlos">San Carlos</option>
                    <option value="Pacifico Central">Pacífico Central</option>
                    <option value="Guanacaste">Guanacaste</option>
                </select>
            </div>

            <!-- 4. DISPONIBILIDAD -->
            <div class="form-group">
                <label for="disponibilidad">Disponibilidad *</label>
                <select id="disponibilidad" name="disponibilidad" required>
                    <option value="" disabled selected>Seleccione disponibilidad</option>
                    <option value="Inmediata">Inmediata</option>
                    <option value="Una semana">Una semana</option>
                    <option value="Dos semanas">Dos semanas</option>
                    <option value="Tres semanas">Tres semanas</option>
                    <option value="Cuatro semanas">Cuatro semanas</option>
                </select>
            </div>

            <!-- 5. EXPERIENCIA EN EL PUESTO -->
            <div class="form-group">
                <label for="tiene_experiencia">¿Tiene experiencia en el puesto? *</label>
                <select id="tiene_experiencia" name="tiene_experiencia" onchange="toggleExperienciaDetails()" required>
                    <option value="" disabled selected>Seleccione una opción</option>
                    <option value="si">Sí</option>
                    <option value="no">No</option>
                </select>
            </div>

            <!-- BLOQUE CONDICIONAL DE EXPERIENCIA -->
            <div id="experienciaDetails" class="conditional-box">
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="detalles_experiencia">Indique el nombre de la empresa, tiempo laborado y funciones principales:</label>
                    <textarea id="detalles_experiencia" name="detalles_experiencia" placeholder="Ej. Distribuidora XYZ, 2 años. Funciones: Atención de clientes, control de rutas, cobros..."></textarea>
                </div>
            </div>

            <button type="submit" class="btn-submit">Siguiente paso</button>
        </form>

        <a href="datos-personales.html" class="back-link" id="backLinkBottom">← Volver a datos personales</a>
    </main>

    <!-- Script para capturar datos y pasar a Formación Académica -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const puestoUrl = urlParams.get('puesto');
        
        if (puestoUrl) {
            const selectPuesto = document.getElementById('puesto');
            selectPuesto.value = puestoUrl;
        }

        const hiddenContainer = document.getElementById('hiddenContainer');
        urlParams.forEach((value, key) => {
            if (key !== 'puesto') { // Evitamos duplicar puesto
                let input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = value;
                hiddenContainer.appendChild(input);
            }
        });

        // Mantener enlaces de retroceso con los datos actuales
        document.getElementById('backLinkTop').href = `datos-personales.html?${urlParams.toString()}`;
        document.getElementById('backLinkBottom').href = `datos-personales.html?${urlParams.toString()}`;

        // Mostrar u ocultar detalles de experiencia
        function toggleExperienciaDetails() {
            const tieneExp = document.getElementById('tiene_experiencia').value;
            const detailsBox = document.getElementById('experienciaDetails');
            const textareaExp = document.getElementById('detalles_experiencia');

            if (tieneExp === 'si') {
                detailsBox.classList.add('active');
                textareaExp.setAttribute('required', 'true');
            } else {
                detailsBox.classList.remove('active');
                textareaExp.removeAttribute('required');
                textareaExp.value = '';
            }
        }
    </script>
</body>
</html>
