<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0d2347">
    <meta name="description" content="Postulación Exitosa - ROBASA Distribuidora.">
    <title>ROBASA | ¡Postulación Exitosa!</title>
    
    <link rel="icon" type="image/png" href="imagenes/robasa-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            color-scheme: dark;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #091833;
            color: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background: 
                radial-gradient(circle at 15% 20%, rgba(245, 132, 38, 0.25) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(18, 59, 112, 0.6) 0%, transparent 50%),
                linear-gradient(135deg, #091833 0%, #0f2d59 100%);
            position: relative;
        }

        body::before, body::after {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            z-index: 0;
            filter: blur(80px);
            opacity: 0.15;
            pointer-events: none;
        }
        body::before { background: #f58426; top: -100px; left: -100px; }
        body::after { background: #123b70; bottom: -100px; right: -100px; }

        main {
            position: relative;
            z-index: 1;
            width: min(100%, 500px);
            padding: 3rem 2rem;
            background: rgba(15, 35, 70, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 1.5rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            animation: fadeIn 0.6s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 1.5rem auto;
            background: rgba(40, 167, 69, 0.15);
            border: 2px solid #28a745;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #28a745;
            font-size: 2rem;
            box-shadow: 0 0 20px rgba(40, 167, 69, 0.3);
        }

        .logo-img {
            max-width: 140px;
            height: auto;
            margin-bottom: 1.5rem;
            filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.3));
        }

        h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 1rem;
            line-height: 1.3;
        }

        p {
            font-size: 0.925rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .btn-home {
            display: block;
            width: 100%;
            padding: 0.9rem 1rem;
            background: linear-gradient(135deg, #f58426 0%, #e06d12 100%);
            border: none;
            border-radius: 0.75rem;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 12px rgba(245, 132, 38, 0.3);
        }

        .btn-home:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(245, 132, 38, 0.5);
            filter: brightness(1.05);
        }
    </style>
</head>
<body>

    <main>
        <img src="imagenes/robasa-logo.png" alt="ROBASA Distribuidora" class="logo-img">
        
        <div class="success-icon">✓</div>

        <h2>¡Gracias por su interés en formar parte del equipo ROBASA!</h2>
        
        <p>Su postulación y cuenta de usuario han sido registradas exitosamente en el sistema.</p>

        <!-- Aquí rediriges a la página principal hecha por tu compañero, pasando opcionalmente el correo o token de sesión -->
        <a href="/postulante" class="btn-home" id="btnIrInicio">Ir a mi panel</a>
    </main>

    <script src="js/backend.js"></script>
</body>
</html>
