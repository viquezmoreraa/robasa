<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123b70">
    <meta name="description" content="Bienvenido a la página de postulación de ROBASA.">
    <title>ROBASA | Bienvenido</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
            background: #123b70;
            color: #fff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            overflow: hidden;
            background:
                radial-gradient(ellipse at 82% 18%, rgb(245 132 38 / 18%), transparent 28rem),
                linear-gradient(135deg, #123b70 0%, #fbfbfc 100%);
        }

        main {
            position: relative;
            isolation: isolate;
            width: min(100% - 2rem, 960px);
            padding: clamp(3rem, 10vw, 7rem) 1.5rem;
            text-align: center;
        }

        main::before,
        main::after {
            position: absolute;
            z-index: -1;
            content: "";
            border: 1px solid rgb(255 255 255 / 12%);
            border-radius: 50%;
        }

        main::before {
            width: 25rem;
            height: 25rem;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        main::after {
            width: 31rem;
            height: 31rem;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .accent {
            width: 3.5rem;
            height: 4px;
            margin: 0 auto 1.5rem;
            border-radius: 99px;
            background: #f58426;
        }

        h1 {
            margin: 0;
            color: #fff;
            font-size: clamp(3.5rem, 11vw, 7rem);
            font-weight: 800;
            letter-spacing: 0.12em;
            line-height: 1;
        }

        p {
            margin: 1.5rem 0 2.5rem;
            color: rgb(255 255 255 / 88%);
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            line-height: 1.6;
        }

        button {
            min-height: 3.5rem;
            padding: 0.9rem 2rem;
            border: 2px solid #f58426;
            border-radius: 0.4rem;
            background: #f58426;
            color: #fff;
            font: inherit;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 160ms ease, color 160ms ease, transform 160ms ease;
        }

        button:hover {
            transform: translateY(-2px);
            background: #fff;
            color: #123b70;
        }

        button:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 4px;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="accent" aria-hidden="true"></div>
        <h1>ROBASA</h1>
        <p>Bienvenido a la pagina de postulacion de ROBASA</p>
        <button type="button">Trabaje con nosotros</button>
    </main>
</body>
</html>
